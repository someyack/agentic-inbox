name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POLICY_AUD: ${{ secrets.POLICY_AUD }}
          TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
          DOMAINS: ${{ secrets.DOMAINS }}
          EMAIL_ADDRESSES: ${{ secrets.EMAIL_ADDRESSES }}
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
        shell: bash
        run: |
          node <<'NODE'
          const required = [
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "POLICY_AUD",
            "TEAM_DOMAIN",
            "DOMAINS",
            "EMAIL_ADDRESSES",
            "WORKER_DOMAIN",
          ];

          for (const name of required) {
            if (!process.env[name] || process.env[name].trim() === "") {
              throw new Error(`${name} must be configured and nonblank`);
            }
          }

          let addresses;
          try {
            addresses = JSON.parse(process.env.EMAIL_ADDRESSES);
          } catch {
            throw new Error("EMAIL_ADDRESSES must be valid JSON");
          }
          if (
            !Array.isArray(addresses) ||
            !addresses.every(
              (address) => typeof address === "string" && address.trim() !== "",
            )
          ) {
            throw new Error(
              "EMAIL_ADDRESSES must be a JSON string array with no blank elements",
            );
          }

          const workerDomain = process.env.WORKER_DOMAIN.trim().toLowerCase();
          const labels = workerDomain.split(".");
          const { isIPv4 } = require("node:net");
          if (
            workerDomain.length > 253 ||
            labels.length < 2 ||
            labels.some(
              (label) =>
                label.length < 1 ||
                label.length > 63 ||
                !/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(label),
            ) ||
            isIPv4(workerDomain)
          ) {
            throw new Error(
              "WORKER_DOMAIN must be a valid DNS hostname with at least two labels",
            );
          }

          const masks = new Set([
            process.env.DOMAINS,
            process.env.DOMAINS.trim(),
            process.env.EMAIL_ADDRESSES,
            JSON.stringify(addresses),
            JSON.stringify(addresses, null, 2),
            process.env.WORKER_DOMAIN,
            process.env.WORKER_DOMAIN.trim(),
            workerDomain,
            ...addresses,
            ...addresses.map((address) => JSON.stringify(address)),
          ]);
          const escapeWorkflowCommand = (value) =>
            value.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
          for (const value of masks) {
            if (value) console.log(`::add-mask::${escapeWorkflowCommand(value)}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build deployment
        env:
          CI_WORKER_CONFIG: "true"
          DOMAINS: ${{ secrets.DOMAINS }}
          EMAIL_ADDRESSES: ${{ secrets.EMAIL_ADDRESSES }}
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
        run: npm run build

      - name: Create Worker secrets file
        id: worker-secrets
        env:
          POLICY_AUD: ${{ secrets.POLICY_AUD }}
          TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          let secretsDirectory;
          try {
            for (const name of ["POLICY_AUD", "TEAM_DOMAIN"]) {
              if (!process.env[name] || process.env[name].trim() === "") {
                throw new Error(`${name} must be configured and nonblank`);
              }
            }

            const runnerTemp = process.env.RUNNER_TEMP;
            secretsDirectory = fs.mkdtempSync(
              path.join(runnerTemp, "worker-secrets-"),
            );
            fs.chmodSync(secretsDirectory, 0o700);
            const secretsFile = path.join(secretsDirectory, "secrets.json");
            fs.writeFileSync(
              secretsFile,
              JSON.stringify({
                POLICY_AUD: process.env.POLICY_AUD,
                TEAM_DOMAIN: process.env.TEAM_DOMAIN,
              }),
              { mode: 0o600, flag: "wx" },
            );
            fs.chmodSync(secretsFile, 0o600);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${secretsFile}\n`);
          } catch (error) {
            if (secretsDirectory) {
              fs.rmSync(secretsDirectory, { recursive: true, force: true });
            }
            throw error;
          }
          NODE

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.74.0"
          command: deploy --secrets-file "${{ steps.worker-secrets.outputs.path }}"

      - name: Clean up Worker secrets file
        if: always()
        env:
          SECRETS_FILE: ${{ steps.worker-secrets.outputs.path }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const secretsFile = process.env.SECRETS_FILE;
          if (secretsFile) {
            fs.rmSync(secretsFile, { force: true });
            const secretsDirectory = path.dirname(secretsFile);
            const runnerTemp = path.resolve(process.env.RUNNER_TEMP);
            if (
              path.dirname(secretsDirectory) === runnerTemp &&
              path.basename(secretsDirectory).startsWith("worker-secrets-")
            ) {
              try {
                fs.rmdirSync(secretsDirectory);
              } catch (error) {
                if (error.code !== "ENOENT" && error.code !== "ENOTEMPTY") throw error;
              }
            }
          }
          NODE
